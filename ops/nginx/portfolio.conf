# Nginx site config for odingarra.dev portfolio.
# Rendered from template by ops/bootstrap-azure-vm.sh and the
# "Sync Nginx config" step in .github/workflows/deploy.yml.
# Placeholders: __DOMAIN__ (apex hostname), __DEPLOY_ROOT__ (release tree).

# Markdown for Agents: requests with Accept: text/markdown get index.md
# as the markdown alternate of the homepage.
map $http_accept $serve_markdown {
    default            0;
    "~*text/markdown"  1;
}

# `gzip on;` already enabled by /etc/nginx/nginx.conf at http scope.
# Per-server overrides below extend it with the SEMRUSH-flagged content types.

# Redirect bare HTTP (apex + www) to HTTPS apex.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Allow Let's Encrypt HTTP-01 challenges over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# Redirect www → apex over HTTPS so the www subdomain also serves HSTS.
server {
    # `listen 443 ssl http2;` legacy syntax — nginx 1.24 does not accept
    # the standalone `http2 on;` directive (added in 1.25). Update if/when
    # the VM moves to a newer nginx package.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root __DEPLOY_ROOT__/current;
    index index.html;

    access_log /var/log/nginx/portfolio.access.log;
    error_log /var/log/nginx/portfolio.error.log;

    # Compressed assets — fixes SEMRUSH "uncompressed JS/CSS" warnings.
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/markdown
        text/xml
        application/json
        application/ld+json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/manifest+json
        application/linkset+json
        image/svg+xml
        font/ttf
        font/otf;

    set $agent_link_header '</.well-known/api-catalog>; rel="api-catalog service-desc"; type="application/linkset+json", </index.md>; rel="alternate"; type="text/markdown", </llms.txt>; rel="service-doc describedby"; type="text/markdown", </sitemap-index.xml>; rel="describedby"; type="application/xml"';

    # Agent discovery: advertise resources via RFC 8288 Link headers.
    add_header Link $agent_link_header always;
    add_header Vary "Accept" always;

    # HSTS: 2 years, include subdomains, preload eligible.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Defensive baseline. Tune CSP if/when inline scripts are removed.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # SEMRUSH (and many crawlers) probe /sitemap.xml even when robots.txt
    # advertises sitemap-index.xml. Alias to the actual index.
    location = /sitemap.xml {
        return 301 /sitemap-index.xml;
    }

    location = / {
        if ($serve_markdown) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location = /index.html {
        if ($serve_markdown) {
            rewrite ^ /index.md last;
        }
        try_files /index.html =404;
    }

    location = /index.md {
        types {}
        default_type text/markdown;
        charset utf-8;
        add_header Link $agent_link_header always;
        add_header Vary "Accept" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header x-markdown-tokens "1184" always;
        try_files /index.md =404;
    }

    location = /llms.txt {
        types {}
        default_type text/markdown;
        charset utf-8;
        try_files /llms.txt =404;
    }

    location = /.well-known/api-catalog {
        types {}
        default_type application/linkset+json;
        charset utf-8;
        try_files /.well-known/api-catalog =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|otf|pdf)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        try_files $uri =404;
    }
}
