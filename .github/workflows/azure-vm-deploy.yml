name: CI/CD Azure VM

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: azure-vm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.12.0
  PNPM_VERSION: 10.27.0
  DEPLOY_ROOT: /var/www/portfolio

jobs:
  build:
    name: Build Astro site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: astro-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: astro-dist
          path: dist

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          SSH_HOST: ${{ secrets.AZURE_VM_HOST }}
          SSH_USER: ${{ secrets.AZURE_VM_USER }}
          SSH_PORT: ${{ secrets.AZURE_VM_PORT }}
        run: |
          set -euo pipefail

          : "${SSH_PRIVATE_KEY:?Missing AZURE_VM_SSH_KEY secret}"
          : "${SSH_HOST:?Missing AZURE_VM_HOST secret}"
          : "${SSH_USER:?Missing AZURE_VM_USER secret}"
          SSH_PORT="${SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/azure_vm_deploy_key
          chmod 600 ~/.ssh/azure_vm_deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          {
            echo "SSH_HOST=$SSH_HOST"
            echo "SSH_USER=$SSH_USER"
            echo "SSH_PORT=$SSH_PORT"
            echo "SSH_KEY=$HOME/.ssh/azure_vm_deploy_key"
          } >> "$GITHUB_ENV"

      - name: Deploy release
        run: |
          set -euo pipefail

          RELEASE_DIR="$DEPLOY_ROOT/releases/$GITHUB_SHA"
          SSH_TARGET="$SSH_USER@$SSH_HOST"
          SSH_COMMAND="ssh -i $SSH_KEY -p $SSH_PORT"

          $SSH_COMMAND "$SSH_TARGET" "mkdir -p '$RELEASE_DIR'"
          rsync -az --delete -e "$SSH_COMMAND" dist/ "$SSH_TARGET:$RELEASE_DIR/"
          $SSH_COMMAND "$SSH_TARGET" "ln -sfnT '$RELEASE_DIR' '$DEPLOY_ROOT/current' && test -f '$DEPLOY_ROOT/current/index.html'"
